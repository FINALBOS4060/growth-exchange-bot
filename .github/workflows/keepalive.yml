name: Keep-alive

# Render free instance 15 daqiqa trafiksiz uxlab qoladi (bot ham to'xtaydi).
# Bu job har 30 daqiqada /healthz ni chaqirib, ASOSIY va STANDBY servislarni
# uyg'oq tutadi. Ikkalasi ham uyg'oq bo'lsa ham, polling faqat bittasida
# bo'ladi (PostgreSQL advisory lock) — ikkinchisi har 30 soniyada qulfni
# qayta so'raydi va asosiy to'xtaganda o'zi ishga tushadi.
#
# Nega 30 daqiqa: private repolarda Actions kvotasi oyiga 2000 daqiqa.
# Asosiy uyg'otish baribir ilova ichida: KEEP_ALIVE=1 (har 10 daqiqa).
#
# Manzillarni sozlash: Settings -> Secrets and variables -> Actions -> Variables
#   APP_URL          = https://sizning-servis.onrender.com
#   APP_URL_STANDBY  = https://growth-exchange-bot-standby.onrender.com
# O'zgaruvchi bo'lmasa: APP_URL uchun standart manzil ishlatiladi,
# APP_URL_STANDBY bo'sh bo'lsa — o'tkazib yuboriladi.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: /healthz ni uyg'otish (asosiy + standby)
        env:
          APP_URL: ${{ vars.APP_URL || 'https://growth-exchange-bot.onrender.com' }}
          APP_URL_STANDBY: ${{ vars.APP_URL_STANDBY }}
        run: |
          set -u
          failed=0
          ping() {
            label="$1"; url="$2"
            if [ -z "$url" ]; then
              echo "[$label] manzil berilmagan — o'tkazib yuborildi"
              return 0
            fi
            url="${url%/}/healthz"
            echo "[$label] so'rov: $url"
            code=000
            for i in 1 2 3; do
              code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 60 "$url" || echo 000)
              echo "[$label] urinish $i -> HTTP $code ($(head -c 120 /tmp/body 2>/dev/null))"
              if [ "$code" = "200" ]; then
                echo "[$label] servis uyg'oq."
                return 0
              fi
              sleep 20
            done
            echo "::error::[$label] /healthz 3 urinishda ham javob bermadi (oxirgi kod: $code)"
            failed=1
          }
          ping "asosiy" "$APP_URL"
          ping "standby" "$APP_URL_STANDBY"
          exit "$failed"
