# Render Blueprint — bepul (free) web service.
# Ishlatish: Render Dashboard -> New + -> Blueprint -> shu repozitoriyani tanlang.
# Batafsil: README.md
services:
  - type: web
    name: growth-exchange-bot
    runtime: node
    plan: free
    region: frankfurt
    # BITTA instans. Ko'paytirish mumkin, LEKIN faqat `DATABASE_URL` berilgan
    # bo'lsa: polling qulfi, scheduler qulfi va holat tranzaksiyasi PostgreSQL
    # advisory lock'lariga tayanadi. Fayl rejimida ikki instans bir-birini
    # "Conflict: terminated by other getUpdates" bilan uzadi.
    numInstances: 1
    # SIGTERM dan keyin long-poll'ni uzish + qulfni bo'shatish uchun vaqt
    # (server.js `shutdown()`: abort → tsikl tugashini kutish → unlock).
    maxShutdownDelaySeconds: 30
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # BotFather'dan olingan token
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Admin Telegram ID'lar, vergul bilan: 123456789,987654321
      - key: ADMIN_IDS
        sync: false
      # Yangiliklar boti (@Dunyo_Yangiliklari_Texno_bot)
      - key: NEWS_BOT_TOKEN
        sync: false
      # Gemini API kaliti
      - key: GEMINI_API_KEY
        sync: false
      # Doimiy saqlash (Postgres) — bo'sh bo'lsa fayl rejimi
      - key: DATABASE_URL
        sync: false
      # Veb panel paroli — Render avtomatik generatsiya qiladi,
      # Dashboard -> Environment bo'limidan ko'rish mumkin.
      - key: ADMIN_PASSWORD
        generateValue: true
      # Free instance 15 daqiqa trafiksiz uxlab qoladi; bot ham to'xtaydi.
      # 1 = o'zini har 10 daqiqada /healthz bilan uyg'otib turadi.
      - key: KEEP_ALIVE
        value: "1"
      - key: KEEP_ALIVE_SEC
        value: "600"
