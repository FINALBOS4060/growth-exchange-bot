name: Keep-alive

# Render free instance 15 daqiqa trafiksiz uxlab qoladi (bot ham to'xtaydi).
# Bu job har 10 daqiqada /healthz ni chaqirib, servisni uyg'oq tutadi.
#
# Manzilni o'zgartirish: Settings -> Secrets and variables -> Actions -> Variables
#   APP_URL = https://sizning-servis.onrender.com
# (o'zgaruvchi bo'lmasa, quyidagi standart manzil ishlatiladi)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: /healthz ni uyg'otish
        env:
          APP_URL: ${{ vars.APP_URL || 'https://growth-exchange-bot.onrender.com' }}
        run: |
          url="${APP_URL%/}/healthz"
          echo "So'rov: $url"
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 60 "$url" || echo 000)
            echo "urinish $i -> HTTP $code ($(cat /tmp/body 2>/dev/null | head -c 120))"
            if [ "$code" = "200" ]; then
              echo "Servis uyg'oq."
              exit 0
            fi
            sleep 20
          done
          echo "::error::/healthz 3 urinishda ham javob bermadi (oxirgi kod: $code)"
          exit 1
